name: Test Notebooks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  notebook-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check notebook install lines
        run: uv run python .internal/check_install_lines.py

      - name: Notebook unit tests
        run: uv run python -m unittest tests/test_notebook_coordinator.py tests/test_notebook_deps.py tests/test_notebook_isolation.py

      - name: Run and validate notebook shard
        run: uv run python .internal/test_notebooks.py --isolated --shard-index ${{ strategy.job-index }} --shard-count ${{ strategy.job-total }}

  test-notebooks:
    name: test-notebooks
    if: always()
    needs: notebook-shard
    runs-on: ubuntu-latest

    steps:
      - name: Require every notebook shard to pass
        run: test "${{ needs.notebook-shard.result }}" = success
